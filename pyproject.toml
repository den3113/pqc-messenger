[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-messenger"
version = "0.1.0"
description = "Прототип децентрализованного мессенджера с постквантовым оконечным шифрованием"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "websockets>=12.0",
    "argon2-cffi>=23.1",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pqc-server = "pqc_messenger.network.relay_server:main"
pqc-client = "pqc_messenger.client.cli:main"

[tool.setuptools.packages.find]
include = ["pqc_messenger*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
